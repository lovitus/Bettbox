name: PR 662 Android Standard
on:
  push:
    branches: [pr662-android-ce8e215]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      SENTRY_BACKEND: none
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust (Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Java (Android)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android NDK
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Build Standard APK for arm64
        run: |
          export PR662_VERSION_CODE=$((2026112301 + GITHUB_RUN_NUMBER))
          flutter pub get
          dart run build_runner build
          dart setup.dart android --arch arm64 --standard
      - name: Sign and verify the test APK
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.PR662_ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          apk=(dist/*.apk)
          test "${#apk[@]}" = 1
          tools=$(ls -dv "$ANDROID_HOME"/build-tools/* | tail -1)
          expected_code=$((2026112301 + GITHUB_RUN_NUMBER))
          "$tools/aapt" dump badging "${apk[0]}" > "$RUNNER_TEMP/apk-badging"
          grep -F "package: name='com.appshub.bettbox.pr662.review' versionCode='$expected_code'" "$RUNNER_TEMP/apk-badging"

          signing_dir=$(mktemp -d "$RUNNER_TEMP/pr662-sign.XXXXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          jq -er .pkcs12 <<<"$SIGNING_BUNDLE" | base64 --decode > "$signing_dir/test.p12"
          SIGNING_PASSWORD=$(jq -er .password <<<"$SIGNING_BUNDLE")
          export SIGNING_PASSWORD
          unset SIGNING_BUNDLE
          "$tools/apksigner" sign --ks "$signing_dir/test.p12" --ks-type PKCS12 --ks-key-alias test \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --v4-signing-enabled false \
            --out "$signing_dir/signed.apk" "${apk[0]}"
          "$tools/apksigner" verify --print-certs "$signing_dir/signed.apk" > "$signing_dir/certificates"
          digest=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$signing_dir/certificates")
          # Keep this certificate and the application ID stable across test updates.
          test "$digest" = '9c678ed6d30df7236f2f6cca33aa731607659629c137b0e7c2721edf762a5077'
          mv -- "$signing_dir/signed.apk" "${apk[0]}"
      - uses: actions/upload-artifact@v7
        with:
          name: Bettbox-PR662-Standard-arm64.apk
          path: dist/*.apk
          archive: false
          if-no-files-found: error
